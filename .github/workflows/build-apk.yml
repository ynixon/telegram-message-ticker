name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. System dependencies
      # ------------------------------------------------------------------ #
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev

      # ------------------------------------------------------------------ #
      # 3. Python + build tools
      # ------------------------------------------------------------------ #
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Buildozer & Cython
        # Cython 3.0+ removed the implicit 'long' builtin alias (was int in Py3).
        # The pyjnius Cython source still uses 'isinstance(arg, long)' and fails
        # to cythonize under Cython 3.x with:
        #   "undeclared name not builtin: long"
        # Cython 0.29.37 is the last 0.29.x release; it fully supports Python 3.11
        # (added in 0.29.36) and retains the 'long' backward-compat alias.
        run: pip install --upgrade buildozer==1.5.0 "cython==0.29.37" virtualenv

      # ------------------------------------------------------------------ #
      # 4. Cache the heavy .buildozer directory (SDK, NDK, wheels)
      #    and the Gradle wrapper distributions (~/.gradle/wrapper) so
      #    the Gradle binary does not need to be re-downloaded on every run.
      # ------------------------------------------------------------------ #
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/wrapper
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      # ------------------------------------------------------------------ #
      # 5. Pre-install Android SDK command-line tools + legacy shim
      #
      #    Buildozer 1.5.0 looks for sdkmanager at the OLD path:
      #      android-sdk/tools/bin/sdkmanager
      #    Modern cmdline-tools install it at:
      #      android-sdk/cmdline-tools/latest/bin/sdkmanager
      #    We download the cmdline-tools, install them, then symlink the
      #    old path so Buildozer can find sdkmanager.
      # ------------------------------------------------------------------ #
      - name: Setup Android SDK & legacy sdkmanager shim
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          CMDTOOLS="$SDK_DIR/cmdline-tools/latest"
          SDKMANAGER="$CMDTOOLS/bin/sdkmanager"

          # Skip if sdkmanager already present (cache hit)
          if [ -f "$SDKMANAGER" ]; then
            echo "sdkmanager already installed (cache hit), skipping download."
          else
            echo "Downloading Android command-line tools..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -Lo /tmp/cmdtools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
            # The zip contains a top-level 'cmdline-tools' folder
            mv /tmp/cmdtools_extracted/cmdline-tools "$CMDTOOLS"
            rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted
          fi

          # Always ensure the legacy shim exists (needed even after cache restore)
          mkdir -p "$SDK_DIR/tools/bin"
          if [ ! -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            ln -sf "$SDKMANAGER" "$SDK_DIR/tools/bin/sdkmanager"
          fi

          # Accept licences
          mkdir -p "$SDK_DIR/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >  "$SDK_DIR/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_DIR/licenses/android-sdk-license"
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" >  "$SDK_DIR/licenses/android-sdk-preview-license"

          # Install required SDK components
          export ANDROID_HOME="$SDK_DIR"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" 2>&1 | grep -v "^\[=" | tail -20

          echo "SDK setup complete."
          ls "$SDK_DIR/tools/bin/sdkmanager"

          # Export ANDROID_HOME and ANDROID_SDK_ROOT for all subsequent steps.
          # The GitHub Actions runner pre-sets ANDROID_SDK_ROOT to the
          # system-installed SDK (/usr/local/lib/android/sdk).  If ANDROID_HOME
          # and ANDROID_SDK_ROOT point to different paths, Gradle 7.x/8.x
          # aborts with:
          #   "Several environment variables and/or system properties contain
          #    different paths to the SDK."
          # Both variables must be set to the same path.
          echo "ANDROID_HOME=$SDK_DIR"        >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR"    >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ #
      # 6a. Stable debug keystore
      #
      #     Android refuses to update an APK if the signing certificate
      #     changes between builds.  The keystore is stored as a
      #     base64-encoded GitHub Actions secret (DEBUG_KEYSTORE_BASE64)
      #     so it is never lost to cache eviction.
      #
      #     Fallback: if the secret is not set, we fall back to cache +
      #     keytool generation (but cache eviction may cause signature
      #     mismatches — set the secret for stable upgrades).
      #
      #     To create the secret from an existing keystore:
      #       base64 -w0 debug.keystore | pbcopy   # macOS
      #       base64 -w0 debug.keystore | xclip     # Linux
      #     Then add it as DEBUG_KEYSTORE_BASE64 in repo Settings → Secrets.
      # ------------------------------------------------------------------ #
      - name: Restore debug keystore from secret
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      - name: Restore debug keystore from cache (fallback)
        if: env.DEBUG_KEYSTORE_BASE64 == ''
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: android-debug-keystore-stable-v1
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      - name: Generate debug keystore (first run only)
        if: env.DEBUG_KEYSTORE_BASE64 == '' && steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Generated new debug keystore."
          echo "⚠️  To avoid upgrade failures, save this keystore as a GitHub secret:"
          echo "    base64 -w0 debug.keystore"
          echo "    → Add output as DEBUG_KEYSTORE_BASE64 in repo Settings → Secrets"
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      # ------------------------------------------------------------------ #
      # 6b. Bundle libc++_shared.so for greenlet
      #
      #    greenlet 2.x is a C++ extension; the NDK compiles it against
      #    libc++_shared.so (the shared C++ STL).  Android does NOT ship
      #    this library as a system library, so it must be bundled inside
      #    the APK under lib/<abi>/.  buildozer.spec's android.add_libs_*
      #    settings copy it into the right place during packaging.
      #
      #    The runner's pre-installed NDK (ANDROID_NDK_HOME) is always
      #    present and provides ABI-stable libc++_shared.so files.
      # ------------------------------------------------------------------ #
      - name: Bundle libc++_shared.so for greenlet
        run: |
          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          mkdir -p libs/armeabi-v7a libs/arm64-v8a
          cp "$SYSROOT/usr/lib/arm-linux-androideabi/libc++_shared.so" libs/armeabi-v7a/
          cp "$SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" libs/arm64-v8a/
          echo "Copied libc++_shared.so:"
          ls -lh libs/armeabi-v7a/libc++_shared.so libs/arm64-v8a/libc++_shared.so

      # ------------------------------------------------------------------ #
      # 6c. Patch Gradle files (jcenter → mavenCentral)
      #
      #     JCenter (jcenter.bintray.com) shut down February 2022.
      #     Some p4a bootstrap templates still list jcenter() as a
      #     Maven repository; Gradle hangs/fails trying to reach it.
      #
      #     IMPORTANT: pythonforandroid is NOT a pip package.  Buildozer
      #     downloads p4a into its own managed directory at:
      #       ~/.buildozer/android/platform/python-for-android-*/
      #     We search that location directly.  On a cold cache (first run)
      #     p4a hasn't been downloaded yet — COUNT=0 is expected and OK.
      # ------------------------------------------------------------------ #
      - name: Patch Gradle files (jcenter → mavenCentral)
        run: |
          COUNT=0
          for SEARCH_ROOT in \
              "$HOME/.buildozer/android/platform/python-for-android-"* \
              ".buildozer"; do
            [ -d "$SEARCH_ROOT" ] || continue
            echo "Searching: $SEARCH_ROOT"
            while IFS= read -r f; do
              echo "  Patching: $f"
              sed -i 's/jcenter()/mavenCentral()/g' "$f"
              COUNT=$((COUNT + 1))
            done < <(grep -rl "jcenter()" "$SEARCH_ROOT" \
                       --include="*.tmpl" --include="*.gradle" \
                       2>/dev/null || true)
          done
          echo "Patched $COUNT file(s).  (0 is OK on a cold cache.)"

      # ------------------------------------------------------------------ #
      # 6d. Remove SDL2 android-project example from dist
      #
      #     SDL2 2.28+ ships an android-project/ directory inside its
      #     source tree containing a complete Gradle project (its own
      #     settings.gradle, app/build.gradle with externalNativeBuild).
      #     When python-for-android copies SDL2 into the dist's jni/SDL/
      #     directory, Gradle's AGP discovers the example project and
      #     tries to build it with ndk-build using the EXAMPLE Android.mk
      #     instead of p4a's top-level one, causing:
      #       [CXX1429] Module main depends on undefined modules: SDL2
      #     Removing android-project/ from the cached dist prevents this.
      #     On cold cache the directory doesn't exist yet (no-op); the
      #     build step below retries after cleanup for that case.
      # ------------------------------------------------------------------ #
      - name: Remove SDL2 android-project from dist and sources
        run: |
          # Remove from both project-local .buildozer AND global ~/.buildozer
          # so that newly created dists never include android-project.
          for ROOT in .buildozer "$HOME/.buildozer"; do
            [ -d "$ROOT" ] || continue
            find "$ROOT" -path "*/SDL*/android-project" -type d \
              -exec rm -rf {} + 2>/dev/null || true
          done
          echo "Cleaned SDL2 android-project dirs from dist and sources."

      # ------------------------------------------------------------------ #
      # 7. Build debug APK
      #
      #    NOTE: Do NOT set JAVA_TOOL_OPTIONS here.  That variable is
      #    inherited by every JVM subprocess (including sdkmanager which
      #    uses Java 8).  Flags like --add-opens are Java 9+ only and
      #    cause sdkmanager to crash with "Unrecognized option".
      #    p4a uses Gradle 8.x which supports Java 17 natively — no
      #    extra JVM flags are needed.
      #
      #    On a cold cache the first attempt creates the p4a dist (which
      #    re-extracts SDL2 with android-project/) and the Gradle build
      #    fails.  The retry removes android-project/ and re-runs; the
      #    dist already exists so buildozer skips straight to Gradle.
      # ------------------------------------------------------------------ #
      - name: Build debug APK
        run: |
          # -------------------------------------------------------------- #
          # Helper: inject android:usesCleartextTraffic="true" into every
          # AndroidManifest.xml AND p4a template that doesn't already have it.
          # This works around buildozer 1.5.0 bug #1611 which breaks the
          # android.extra_manifest_application_arguments option.
          #
          # We search BOTH .buildozer (project build dir) and ~/.buildozer
          # (global p4a templates) so that new dists also get the attribute.
          # -------------------------------------------------------------- #
          patch_manifests() {
            for ROOT in .buildozer "$HOME/.buildozer"; do
              [ -d "$ROOT" ] || continue

              # Patch dist and src manifests
              find "$ROOT" -name "AndroidManifest*.xml" \
                   \( -path "*/dists/*" -o -path "*/templates/*" -o -path "*/src/main/*" \) \
                   2>/dev/null \
              | while read -r f; do
                  if ! grep -q 'usesCleartextTraffic' "$f"; then
                    sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$f"
                    echo "  Patched: $f"
                  fi
                done || true

              # Patch .tmpl.xml template files used by p4a to generate manifests
              find "$ROOT" -name "AndroidManifest.tmpl.xml" 2>/dev/null \
              | while read -r f; do
                  if ! grep -q 'usesCleartextTraffic' "$f"; then
                    sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$f"
                    echo "  Patched template: $f"
                  fi
                done || true
            done
          }

          # Helper: remove SDL2 android-project from all locations
          remove_sdl2_android_project() {
            for ROOT in .buildozer "$HOME/.buildozer"; do
              [ -d "$ROOT" ] || continue
              find "$ROOT" -path "*/SDL*/android-project" -type d \
                -exec rm -rf {} + 2>/dev/null || true
            done
          }

          # Helper: upgrade Gradle wrapper to 7.6.4 (fixes Java 17.0.18 parsing)
          upgrade_gradle_wrapper() {
            for ROOT in .buildozer "$HOME/.buildozer"; do
              [ -d "$ROOT" ] || continue
              find "$ROOT" -name "gradle-wrapper.properties" 2>/dev/null \
              | while read -r f; do
                  sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.4-all.zip|' "$f"
                  echo "  Upgraded Gradle wrapper: $f"
                done || true
            done
          }

          # Helper: remove the 'wrapper' task from libwebp's build.gradle.
          # Gradle 7.6+ has a built-in 'wrapper' task; the duplicate in
          # libwebp causes "Cannot add task 'wrapper' as a task with that
          # name already exists".  libwebp is built via ndk-build, not Gradle,
          # so its build.gradle is only evaluated when running gradlew from
          # the dist root.
          fix_libwebp_gradle() {
            find .buildozer -path "*/libwebp/build.gradle" 2>/dev/null \
            | while read -r f; do
                if grep -q 'task wrapper' "$f"; then
                  sed -i '/task wrapper/,/^}/d' "$f"
                  echo "  Removed wrapper task from: $f"
                fi
              done || true
          }

          # Patch templates and manifests before the first attempt
          echo "=== Pre-build manifest patching ==="
          patch_manifests
          upgrade_gradle_wrapper

          buildozer android debug || {
            echo ""
            echo "=== Build failed – cleaning up and retrying ==="
            remove_sdl2_android_project
            patch_manifests
            upgrade_gradle_wrapper
            # Clean Gradle build cache so it doesn't remember android-project
            find .buildozer -name "build" -path "*/dists/*/build" -type d \
              -exec rm -rf {} + 2>/dev/null || true
            find .buildozer -name ".gradle" -path "*/dists/*/.gradle" -type d \
              -exec rm -rf {} + 2>/dev/null || true
            buildozer android debug
          }

          # -------------------------------------------------------------- #
          # Post-build verification: if buildozer regenerated the dist from
          # the template (e.g. after a version bump), the manifest may have
          # been overwritten.  Detect this and rebuild just the APK via
          # Gradle if needed.
          # -------------------------------------------------------------- #
          echo ""
          echo "=== Post-build manifest verification ==="
          rm -f /tmp/_needs_rebuild
          find .buildozer -name "AndroidManifest.xml" \
               \( -path "*/dists/*" -o -path "*/src/main/*" \) \
               2>/dev/null \
          | while read -r f; do
              if ! grep -q 'usesCleartextTraffic' "$f"; then
                echo "  MISSING usesCleartextTraffic in: $f"
                sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$f"
                echo "  Fixed: $f"
                echo "true" > /tmp/_needs_rebuild
              else
                echo "  OK: $f"
              fi
            done || true

          if [ -f /tmp/_needs_rebuild ]; then
            echo ""
            echo "=== Manifest was overwritten — rebuilding APK via Gradle ==="
            # Remove SDL2 android-project BEFORE Gradle rebuild
            remove_sdl2_android_project
            upgrade_gradle_wrapper
            fix_libwebp_gradle
            GRADLEW=$(find .buildozer -path "*/dists/*/gradlew" -type f 2>/dev/null | head -1)
            if [ -n "$GRADLEW" ]; then
              DIST_DIR=$(dirname "$GRADLEW")
              cd "$DIST_DIR"
              chmod +x gradlew
              ./gradlew assembleDebug
              cd -
              # Copy rebuilt APK back to bin/
              find .buildozer -name "*-debug.apk" -newer "$GRADLEW" 2>/dev/null | head -1 | \
                while read apk; do
                  mkdir -p bin
                  cp "$apk" bin/
                  echo "Copied rebuilt APK: $apk → bin/"
                done || true
            fi
            rm -f /tmp/_needs_rebuild
          fi
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      # ------------------------------------------------------------------ #
      # 7b. Diagnose build failures
      #
      #     Runs only when the build step above fails.  Prints key
      #     Gradle config files and re-runs gradlew with --stacktrace
      #     so the real error is visible.  Both the FIRST 200 lines
      #     (catches repository/download errors) and the LAST 300 lines
      #     (catches compile/link errors) of the Gradle output are shown.
      # ------------------------------------------------------------------ #
      - name: Diagnose build failure
        if: failure()
        run: |
          GRADLEW=$(find .buildozer -path "*/dists/*/gradlew" -type f 2>/dev/null | head -1 || true)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found – build failed before the Gradle distribution was created."
            echo "Check the sdkmanager / Python compilation steps above for the real error."
            exit 0
          fi
          DIST_DIR=$(dirname "$GRADLEW")

          echo "=== gradle-wrapper.properties ==="
          cat "$DIST_DIR/gradle/wrapper/gradle-wrapper.properties" || true

          echo ""
          echo "=== local.properties ==="
          cat "$DIST_DIR/local.properties" 2>/dev/null || echo "(not found)"

          echo ""
          echo "=== build.gradle ==="
          cat "$DIST_DIR/build.gradle" 2>/dev/null || \
            find "$DIST_DIR" -maxdepth 2 -name "build.gradle" | head -3 | \
              while read f; do echo "--- $f ---"; cat "$f"; done

          echo ""
          echo "=== AndroidManifest.xml ==="
          find .buildozer -name "AndroidManifest.xml" 2>/dev/null | head -5 | while read f; do
            echo "--- $f ---"
            cat "$f"
          done

          echo ""
          echo "=== ndk-build direct test (reveals the actual C++ configure error) ==="
          NDK_BUILD=$(find .buildozer -name "ndk-build" -not -path "*/test/*" \
                        -type f 2>/dev/null | head -1 || true)
          ANDROID_MK=$(find .buildozer \
                         -path "*/jni/SDL/android-project/app/jni/Android.mk" \
                         2>/dev/null | head -1 || true)
          APPLICATION_MK=$(find .buildozer \
                             -path "*/jni/SDL/android-project/app/jni/Application.mk" \
                             2>/dev/null | head -1 || true)
          if [ -n "$NDK_BUILD" ] && [ -n "$ANDROID_MK" ]; then
            echo "NDK_BUILD: $NDK_BUILD"
            echo "ANDROID_MK: $ANDROID_MK"
            echo "--- Application.mk ---"
            cat "$APPLICATION_MK" 2>/dev/null || echo "(not found)"
            echo "--- Android.mk (first 30 lines) ---"
            head -30 "$ANDROID_MK" 2>/dev/null || true
            echo "--- ndk-build output ---"
            "$NDK_BUILD" \
              NDK_ALL_ABIS=arm64-v8a \
              APP_ABI=arm64-v8a \
              NDK_APPLICATION_MK="$APPLICATION_MK" \
              APP_BUILD_SCRIPT="$ANDROID_MK" \
              NDK_PROJECT_PATH=null \
              V=1 2>&1 | tee /tmp/ndkbuild-out.txt | head -60 || true
            grep -E "error:|Error:|make:|warning:" /tmp/ndkbuild-out.txt 2>/dev/null | head -20 | \
              while IFS= read -r line; do
                echo "::warning::NDK: $(echo "$line" | sed 's/[%]/%25/g')"
              done || true
          else
            echo "::error::ndk-build or Android.mk not found"
            echo "NDK_BUILD=$NDK_BUILD  ANDROID_MK=$ANDROID_MK"
          fi

          echo ""
          echo "=== gradlew clean assembleDebug --info --stacktrace ==="
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          # ANDROID_HOME is already exported from $GITHUB_ENV (set in step 5).
          # Also set ANDROID_SDK_ROOT to the same value so Gradle does not
          # complain about "different paths to the SDK".
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # Upgrade Gradle wrapper and fix libwebp before running gradlew
          find .buildozer "$HOME/.buildozer" -name "gradle-wrapper.properties" 2>/dev/null | \
            while read -r gw; do
              sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.4-all.zip|' "$gw"
            done || true
          find .buildozer -path "*/libwebp/build.gradle" 2>/dev/null | \
            while read -r f; do
              sed -i '/task wrapper/,/^}/d' "$f"
            done || true
          cd "$DIST_DIR"
          chmod +x gradlew
          ./gradlew clean assembleDebug --info --stacktrace > /tmp/gradle-out.txt 2>&1 || true
          TOTAL=$(wc -l < /tmp/gradle-out.txt)
          echo "Total Gradle output lines: $TOTAL"
          echo ""
          echo "--- First 150 lines ---"
          head -150 /tmp/gradle-out.txt
          echo ""
          echo "--- Last 400 lines ---"
          tail -400 /tmp/gradle-out.txt

          # Annotations: failing task + "What went wrong" block
          echo ""
          echo "=== GitHub Annotations ==="
          grep -E "FAILED$" /tmp/gradle-out.txt 2>/dev/null | head -5 | \
            while IFS= read -r line; do
              echo "::error::FAILED TASK: $(echo "$line" | sed 's/[%]/%25/g')"
            done || true
          awk '
            /^\* What went wrong:/ { found=1; count=0 }
            /^\* Try:/             { if (found) found=0 }
            found && count < 25 {
              msg = $0; gsub(/%/, "%25", msg)
              print "::error::" msg; count++
            }
          ' /tmp/gradle-out.txt 2>/dev/null | grep -v "^::error::$" || true

      # ------------------------------------------------------------------ #
      # 8. Rename artifact to something meaningful
      # ------------------------------------------------------------------ #
      - name: Rename APK
        run: |
          APK=$(ls bin/*.apk | head -1)
          mv "$APK" bin/telegram-message-ticker-debug.apk

      # ------------------------------------------------------------------ #
      # 9. Upload APK as workflow artifact (always downloadable)
      # ------------------------------------------------------------------ #
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-message-ticker-apk
          path: bin/telegram-message-ticker-debug.apk
          retention-days: 30

      # ------------------------------------------------------------------ #
      # 9. Create a GitHub Release with the APK (on version tags only)
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/telegram-message-ticker-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
