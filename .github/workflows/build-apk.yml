name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. System dependencies
      # ------------------------------------------------------------------ #
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev

      # ------------------------------------------------------------------ #
      # 3. Python + build tools
      # ------------------------------------------------------------------ #
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Buildozer & Cython
        run: pip install --upgrade buildozer==1.5.0 cython virtualenv

      # ------------------------------------------------------------------ #
      # 4. Cache the heavy .buildozer directory (SDK, NDK, wheels)
      # ------------------------------------------------------------------ #
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ------------------------------------------------------------------ #
      # 5. Accept Android SDK licences (needed on first run)
      # ------------------------------------------------------------------ #
      - name: Pre-accept Android SDK licences
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" \
            >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      # ------------------------------------------------------------------ #
      # 6. Build debug APK
      # ------------------------------------------------------------------ #
      - name: Build debug APK
        run: buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      # ------------------------------------------------------------------ #
      # 7. Rename artifact to something meaningful
      # ------------------------------------------------------------------ #
      - name: Rename APK
        run: |
          APK=$(ls bin/*.apk | head -1)
          mv "$APK" bin/telegram-message-ticker-debug.apk

      # ------------------------------------------------------------------ #
      # 8. Upload APK as workflow artifact (always downloadable)
      # ------------------------------------------------------------------ #
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-message-ticker-apk
          path: bin/telegram-message-ticker-debug.apk
          retention-days: 30

      # ------------------------------------------------------------------ #
      # 9. Create a GitHub Release with the APK (on version tags only)
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/telegram-message-ticker-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
