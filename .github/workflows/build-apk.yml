name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout
      # ------------------------------------------------------------------ #
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # 2. System dependencies
      # ------------------------------------------------------------------ #
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev

      # ------------------------------------------------------------------ #
      # 3. Python + build tools
      # ------------------------------------------------------------------ #
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Buildozer & Cython
        # Cython 3.0+ removed the implicit 'long' builtin alias (was int in Py3).
        # The pyjnius Cython source still uses 'isinstance(arg, long)' and fails
        # to cythonize under Cython 3.x with:
        #   "undeclared name not builtin: long"
        # Cython 0.29.37 is the last 0.29.x release; it fully supports Python 3.11
        # (added in 0.29.36) and retains the 'long' backward-compat alias.
        run: pip install --upgrade buildozer==1.5.0 "cython==0.29.37" virtualenv

      # ------------------------------------------------------------------ #
      # 4. Cache the heavy .buildozer directory (SDK, NDK, wheels)
      #    and the Gradle wrapper distributions (~/.gradle/wrapper) so
      #    the Gradle binary does not need to be re-downloaded on every run.
      # ------------------------------------------------------------------ #
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/wrapper
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ------------------------------------------------------------------ #
      # 4b. Force Gradle 7.6 in every gradle-wrapper.properties
      #
      #     The p4a sdl2 bootstrap ships a gradle-wrapper.properties that
      #     may reference an old Gradle version incompatible with Java 17.
      #     Gradle 7.6 is the last 7.x release and has full Java 17 support.
      #
      #     We patch in two places:
      #       a) The pip-installed p4a template (used when building from
      #          scratch / cache miss) so new distributions get 7.6.
      #       b) Any existing distribution in .buildozer (cache hit) so
      #          previously-built dists are also upgraded.
      # ------------------------------------------------------------------ #
      - name: Force Gradle 7.6 for Java 17 compatibility
        run: |
          GRADLE_76="https\\://services.gradle.org/distributions/gradle-7.6-bin.zip"
          PROPS_CONTENT="distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=${GRADLE_76}
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists"

          # (a) Patch the p4a-installed template so fresh distributions use 7.6
          P4A_DIR=$(python -c "import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))" 2>/dev/null || true)
          if [ -n "$P4A_DIR" ]; then
            find "$P4A_DIR" -name "gradle-wrapper.properties" | while read f; do
              echo "Patching p4a template: $f"
              printf '%s\n' "$PROPS_CONTENT" > "$f"
            done
          fi

          # (b) Patch any existing distribution in .buildozer (cache hit)
          find .buildozer -name "gradle-wrapper.properties" 2>/dev/null | while read f; do
            echo "Patching cached dist: $f"
            printf '%s\n' "$PROPS_CONTENT" > "$f"
          done

          echo "Gradle wrapper patching complete."

      # ------------------------------------------------------------------ #
      # 5. Pre-install Android SDK command-line tools + legacy shim
      #
      #    Buildozer 1.5.0 looks for sdkmanager at the OLD path:
      #      android-sdk/tools/bin/sdkmanager
      #    Modern cmdline-tools install it at:
      #      android-sdk/cmdline-tools/latest/bin/sdkmanager
      #    We download the cmdline-tools, install them, then symlink the
      #    old path so Buildozer can find sdkmanager.
      # ------------------------------------------------------------------ #
      - name: Setup Android SDK & legacy sdkmanager shim
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          CMDTOOLS="$SDK_DIR/cmdline-tools/latest"
          SDKMANAGER="$CMDTOOLS/bin/sdkmanager"

          # Skip if sdkmanager already present (cache hit)
          if [ -f "$SDKMANAGER" ]; then
            echo "sdkmanager already installed (cache hit), skipping download."
          else
            echo "Downloading Android command-line tools..."
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -Lo /tmp/cmdtools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extracted
            # The zip contains a top-level 'cmdline-tools' folder
            mv /tmp/cmdtools_extracted/cmdline-tools "$CMDTOOLS"
            rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extracted
          fi

          # Always ensure the legacy shim exists (needed even after cache restore)
          mkdir -p "$SDK_DIR/tools/bin"
          if [ ! -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            ln -sf "$SDKMANAGER" "$SDK_DIR/tools/bin/sdkmanager"
          fi

          # Accept licences
          mkdir -p "$SDK_DIR/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >  "$SDK_DIR/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_DIR/licenses/android-sdk-license"
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" >  "$SDK_DIR/licenses/android-sdk-preview-license"

          # Install required SDK components
          export ANDROID_HOME="$SDK_DIR"
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" 2>&1 | grep -v "^\[=" | tail -20

          echo "SDK setup complete."
          ls "$SDK_DIR/tools/bin/sdkmanager"

          # Export ANDROID_HOME for all subsequent steps.
          # Note: ${{ env.HOME }} does not expand in step env: blocks because
          # HOME is a shell variable, not a GitHub Actions env context variable.
          # Writing to GITHUB_ENV is the correct way to pass it forward.
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ #
      # 6a. Stable debug keystore
      #
      #     Android refuses to update an APK if the signing certificate
      #     changes between builds.  We cache the debug keystore under a
      #     *fixed* cache key so it survives across buildozer.spec bumps.
      #     On the very first run (cache miss) keytool generates a new
      #     keystore; every subsequent run reuses the same one.
      # ------------------------------------------------------------------ #
      - name: Restore debug keystore cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: android-debug-keystore-stable-v1

      - name: Generate debug keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Generated new debug keystore."

      # ------------------------------------------------------------------ #
      # 6b. Bundle libc++_shared.so for greenlet
      #
      #    greenlet 2.x is a C++ extension; the NDK compiles it against
      #    libc++_shared.so (the shared C++ STL).  Android does NOT ship
      #    this library as a system library, so it must be bundled inside
      #    the APK under lib/<abi>/.  buildozer.spec's android.add_libs_*
      #    settings copy it into the right place during packaging.
      #
      #    The runner's pre-installed NDK (ANDROID_NDK_HOME) is always
      #    present and provides ABI-stable libc++_shared.so files.
      # ------------------------------------------------------------------ #
      - name: Bundle libc++_shared.so for greenlet
        run: |
          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          mkdir -p libs/armeabi-v7a libs/arm64-v8a
          cp "$SYSROOT/usr/lib/arm-linux-androideabi/libc++_shared.so" libs/armeabi-v7a/
          cp "$SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" libs/arm64-v8a/
          echo "Copied libc++_shared.so:"
          ls -lh libs/armeabi-v7a/libc++_shared.so libs/arm64-v8a/libc++_shared.so

      # ------------------------------------------------------------------ #
      # 7. Build debug APK
      #
      #    JAVA_TOOL_OPTIONS: JVM flags picked up by every Java process
      #    (including Gradle) to allow reflection access that Java 17
      #    restricts by default.  Required if the Gradle version is <7.3.
      # ------------------------------------------------------------------ #
      - name: Build debug APK
        run: buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          JAVA_TOOL_OPTIONS: >-
            --add-opens java.base/java.io=ALL-UNNAMED
            --add-opens java.base/java.lang=ALL-UNNAMED
            --add-opens java.base/java.lang.invoke=ALL-UNNAMED
            --add-opens java.base/java.util=ALL-UNNAMED
            --add-opens java.base/java.util.concurrent=ALL-UNNAMED
            --add-opens java.base/sun.nio.ch=ALL-UNNAMED

      # ------------------------------------------------------------------ #
      # 7b. Diagnose Gradle failures
      #
      #     Runs only when the build step above fails.  Re-executes gradlew
      #     with --stacktrace so the real Java/Gradle error is visible in the
      #     CI log.  Also prints the generated AndroidManifest.xml so XML
      #     issues are immediately obvious.
      # ------------------------------------------------------------------ #
      - name: Diagnose Gradle failure
        if: failure()
        run: |
          GRADLEW=$(find .buildozer -name "gradlew" -type f 2>/dev/null | head -1 || true)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found – the distribution was not created (build failed before Gradle)."
            exit 0
          fi
          DIST_DIR=$(dirname "$GRADLEW")
          echo "=== gradle-wrapper.properties ==="
          cat "$DIST_DIR/gradle/wrapper/gradle-wrapper.properties" || true
          echo ""
          echo "=== AndroidManifest.xml ==="
          find "$DIST_DIR" -name "AndroidManifest.xml" | head -3 | while read f; do
            echo "--- $f ---"
            cat "$f"
          done
          echo ""
          echo "=== gradlew clean assembleDebug --stacktrace (last 400 lines) ==="
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export JAVA_TOOL_OPTIONS="--add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED"
          cd "$DIST_DIR"
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace 2>&1 | tail -400 || true

      # ------------------------------------------------------------------ #
      # 8. Rename artifact to something meaningful
      # ------------------------------------------------------------------ #
      - name: Rename APK
        run: |
          APK=$(ls bin/*.apk | head -1)
          mv "$APK" bin/telegram-message-ticker-debug.apk

      # ------------------------------------------------------------------ #
      # 9. Upload APK as workflow artifact (always downloadable)
      # ------------------------------------------------------------------ #
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-message-ticker-apk
          path: bin/telegram-message-ticker-debug.apk
          retention-days: 30

      # ------------------------------------------------------------------ #
      # 9. Create a GitHub Release with the APK (on version tags only)
      # ------------------------------------------------------------------ #
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/telegram-message-ticker-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
