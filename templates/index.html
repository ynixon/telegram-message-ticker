<!DOCTYPE html>
<html lang="{{ translations.get('lang_code', 'en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ translations['title'] }}</title>
    
    <!-- 1. Include Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    
    <!-- 2. Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Embed the translations and message_age_limit object -->
    <script type="text/javascript">
        var translations = {{ translations | tojson }};
        
        // Safely passing message_age_limit from the server to client in hours
        var message_age_limit_in_hours = {{ message_age_limit | default(0.25) | tojson }};
        
        // message_age_limit in hours (used by ticker.js for filtering)
        var message_age_limit = message_age_limit_in_hours;
        
        // Define the changeLanguage function before it's used
        function changeLanguage(lang) {
            window.location.href = `/set_language/${lang}`;
        }
    </script>
    
    <!-- 3. Include Your Custom Script -->
    <script src="{{ url_for('static', filename='ticker.js') }}?v={{ cache_bust }}"></script>
    
    <!-- 4. Include Your CSS (if any) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>{{ translations['title'] }}</h1>
    <select id="language-selector" onchange="changeLanguage(this.value)">
        <option value="en" {{ 'selected' if translations['lang_code'] == 'en' else '' }}>English</option>
        <option value="he" {{ 'selected' if translations['lang_code'] == 'he' else '' }}>עברית</option>
    </select>

    <!-- Loading message to display before the first message is loaded -->
    <div id="loading-message" class="loading-text">{{ translations['loading_message'] }}</div>

    <!-- Backend status (visible until messages arrive) -->
    <div id="backend-status" style="color:#888; font-size:13px; text-align:center; padding:8px; display:none;"></div>
    
    <!-- Section to display messages -->
    <div id="messages" style="display:none;"> <!-- Hide messages initially -->
        <h2 id="channel-name">{{ translations['channel'] }}</h2>
        <div id="message-text"></div>
        <div id="message-media"></div>
        <div id="message-time">{{ translations['message_time'] }}</div>
        <!-- Message counter -->
        <div id="message-counter"></div>
    </div>
    
    <!-- Push indicator and lost connection -->
    <div id="connection-status">
        <span id="push-indicator" style="display:none; color: red;">{{ translations['push_message'] }}</span> <!-- Push message indicator -->
        <span id="lost-connection" style="display:none; color: red;">{{ translations['lost_connection'] }}</span> <!-- Lost connection indicator -->
    </div>

    <!-- Refresh feed button -->
    <button id="refreshFeed">{{ translations['refresh_feed'] }}</button>

    <!-- Refresh loading overlay — displayed ON TOP of existing content -->
    <div id="refresh-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:9998; justify-content:center; align-items:center;">
        <div style="color:white; font-size:28px; text-shadow:0 0 10px #000;">⟳ {{ translations.get('loading_message', 'Loading...') }}</div>
    </div>

    <!-- Fullscreen image overlay (lightbox) -->
    <div id="image-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; justify-content:center; align-items:center;" onclick="closeImageOverlay()">
        <img id="overlay-image" src="" style="max-width:95%; max-height:95%; object-fit:contain;">
    </div>

    <!-- Link handling is done in ticker.js (_openExtLink) to ensure it works
         on both touch and click events, including Android WebView edge cases. -->
    <script>

    // Image lightbox overlay: fullscreen view of tapped images
    function openImageOverlay(src) {
        var overlay = document.getElementById('image-overlay');
        var img = document.getElementById('overlay-image');
        if (overlay && img) {
            img.src = src;
            overlay.style.display = 'flex';
        }
    }
    function closeImageOverlay() {
        var overlay = document.getElementById('image-overlay');
        if (overlay) overlay.style.display = 'none';
    }
    </script>

    <!-- Vanilla JS fallback: works even if CDN scripts (jQuery/Socket.IO) fail to load -->
    <script>
    (function() {
        var fallbackActive = false, displayedIds = {}, msgs = [], idx = 0, timer = null;
        // Activate after 6s if jQuery-based code hasn't shown any messages
        setTimeout(function() {
            var md = document.getElementById('messages');
            if (!md || md.style.display === 'none') {
                console.log('Vanilla fallback: activating (jQuery may not have loaded)');
                fallbackActive = true;
                poll();
                setInterval(poll, 4000);
            }
        }, 6000);
        function poll() {
            fetch('/api/status').then(function(r){return r.json();}).then(function(st) {
                var el = document.getElementById('backend-status');
                if (el && (!msgs.length)) {
                    el.style.display = 'block';
                    el.textContent = st.status + ' (channels: ' + st.channels + ', msgs: ' + st.messages + ')';
                }
            }).catch(function(){});
            fetch('/api/messages').then(function(r){return r.json();}).then(function(data) {
                if (data.messages && data.messages.length > 0) render(data.messages);
            }).catch(function(e){ console.warn('Fallback poll error:', e); });
        }
        function render(list) {
            var ld = document.getElementById('loading-message');
            if (ld) ld.style.display = 'none';
            var md = document.getElementById('messages');
            if (md) md.style.display = 'block';
            var bs = document.getElementById('backend-status');
            if (bs) bs.style.display = 'none';
            var added = 0;
            list.forEach(function(m) {
                if (!displayedIds[m.id]) { displayedIds[m.id] = true; msgs.push(m); added++; }
            });
            if (added > 0 && !timer) showNext();
        }
        function showNext() {
            if (!msgs.length) return;
            if (idx >= msgs.length) idx = 0;
            var m = msgs[idx];
            var ch = document.getElementById('channel-name');
            var tx = document.getElementById('message-text');
            var tm = document.getElementById('message-time');
            var ct = document.getElementById('message-counter');
            if (ch) ch.textContent = m.channel || '';
            if (tx) tx.innerHTML = m.message || '';
            if (tm) {
                var d = new Date(m.time);
                if (!isNaN(d.getTime())) {
                    tm.textContent = d.toLocaleString('he-IL', {timeZone:'Asia/Jerusalem', hour:'2-digit', minute:'2-digit', second:'2-digit', day:'2-digit', month:'2-digit', year:'numeric', hour12:false});
                } else {
                    tm.textContent = m.time || '';
                }
            }
            if (ct) ct.textContent = (idx + 1) + ' / ' + msgs.length;
            idx++;
            clearTimeout(timer);
            timer = setTimeout(showNext, 10000);
        }
        // Navigation for vanilla fallback — tap left/right on #messages
        var md2 = document.getElementById('messages');
        if (md2) md2.addEventListener('click', function(e) {
            if (!fallbackActive || !msgs.length) return;
            var w = md2.offsetWidth;
            var x = e.pageX - md2.getBoundingClientRect().left;
            if (x < w * 0.35) {
                idx = (idx - 2 + msgs.length) % msgs.length;
                clearTimeout(timer); showNext();
            } else if (x > w * 0.65) {
                clearTimeout(timer); showNext();
            }
        });
    })();
    </script>
</body>
</html>
